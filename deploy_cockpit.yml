---
# ==============================================================================
# PLAYBOOK: deploy_cockpit.yml
# ==============================================================================
- name: Deploy Cockpit Web Console Container
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    user_home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
    cockpit_port: 9090
    podman_bin: >-
      {% if lookup('ansible.builtin.file', '/run/.containerenv', errors='ignore') | length > 0 %}
      {% if lookup('ansible.builtin.pipe', 'command -v distrobox-host-exec || true') | length > 0 %}
      distrobox-host-exec podman
      {% elif lookup('ansible.builtin.pipe', 'command -v flatpak-spawn || true') | length > 0 %}
      flatpak-spawn --host podman
      {% else %}
      podman
      {% endif %}
      {% else %}
      podman
      {% endif %}

  tasks:
    - name: Ensure Cockpit configuration directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ user_home }}/.config/systemd/user"
        - "{{ user_home }}/.config/cockpit/machines.d"

    - name: Register host-system target in Cockpit machines definition
      ansible.builtin.template:
        src: "{{ playbook_dir }}/assets/10-host-system.json.j2"
        dest: "{{ user_home }}/.config/cockpit/machines.d/10-host-system.json"
        mode: '0644'

    - name: Register lima-github-runner target in Cockpit machines definition
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/assets/20-lima-github-runner.json"
        dest: "{{ user_home }}/.config/cockpit/machines.d/20-lima-github-runner.json"
        mode: '0644'

    - name: Enable Multi-Host switcher in Cockpit configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/assets/cockpit.conf"
        dest: "{{ user_home }}/.config/cockpit/cockpit.conf"
        mode: '0644'

    - name: Create systemd user service for Cockpit WS container
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/assets/cockpit-ws.service"
        dest: "{{ user_home }}/.config/systemd/user/cockpit-ws.service"
        mode: '0644'

    - name: Enable and start Cockpit systemd user service
      ansible.builtin.systemd_service:
        name: cockpit-ws.service
        scope: user
        state: started
        enabled: true
        daemon_reload: true
      failed_when: false
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid | default('1000') }}"
