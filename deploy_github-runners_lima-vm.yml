---
# ==============================================================================
# PLAYBOOK: Deploy Containerized Lima KVM VM and GitHub Actions Runners
# ==============================================================================
- name: Deploy Containerized Lima KVM VM and GitHub Actions Runners
  hosts: localhost
  connection: local
  gather_facts: true

  vars_files:
    - "{{ playbook_dir }}/vars/runners.yml"
    - "{{ playbook_dir }}/vars/vault.yml"

  vars:
    lima_vm_name: "github-runner"
    container_name: "lima-vm-container"
    image_tag: "lima-kvm-runner:fedora-minimal"
    user_home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
    podman_bin: >-
      {% if lookup('ansible.builtin.file', '/run/.containerenv', errors='ignore') | length > 0 %}
      {% if lookup('ansible.builtin.pipe', 'command -v distrobox-host-exec') | length > 0 %}
      distrobox-host-exec podman
      {% elif lookup('ansible.builtin.pipe', 'command -v flatpak-spawn') | length > 0 %}
      flatpak-spawn --host podman
      {% else %}
      podman
      {% endif %}
      {% else %}
      podman
      {% endif %}

  tasks:
    # --------------------------------------------------------------------------
    # TASK 1: Input Validation
    # Validate that required runner and secret vault variables are set before proceeding.
    # --------------------------------------------------------------------------
    - name: "[Task 1] Validate required variables are present"
      ansible.builtin.assert:
        that:
          - github_runners is defined and github_runners | length > 0
          - github_pat is defined or (github_runners[0].token is defined)
        fail_msg: "Ensure vars/vault.yml and vars/runners.yml are properly configured with github_runners and github_pat."

    # --------------------------------------------------------------------------
    # TASK 2: Main Deployment Block
    # Contains the primary provisioning sequence for directories, VM container, and runners.
    # --------------------------------------------------------------------------
    - name: "[Task 2] Execute Deployment Block"
      block:
        # ----------------------------------------------------------------------
        # TASK 3: Host Directory Structure Provisioning
        # Ensure configuration and state directories exist on the host user account.
        # ----------------------------------------------------------------------
        - name: "[Task 3] Ensure required host directories exist"
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: '0755'
          loop:
            - "{{ user_home }}/.config/lima"
            - "{{ user_home }}/.config/systemd/user"
            - "{{ user_home }}/.ssh/config.d"
            - "{{ user_home }}/.lima"

        # ----------------------------------------------------------------------
        # TASK 4: SSH Configuration Include Rule
        # Ensure ~/.ssh/config includes modular config files from ~/.ssh/config.d/
        # ----------------------------------------------------------------------
        - name: "[Task 4] Ensure SSH config includes config.d directory"
          ansible.builtin.lineinfile:
            path: "{{ user_home }}/.ssh/config"
            line: "Include ~/.ssh/config.d/*"
            create: true
            mode: '0600'
            insertbefore: BOF

        # ----------------------------------------------------------------------
        # TASK 5: Host Lima Engine Containerfile Definition
        # Copy Containerfile from assets to build the Fedora-minimal container image housing Lima.
        # ----------------------------------------------------------------------
        - name: "[Task 5] Write Containerfile for fedora-minimal Lima runner image"
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/assets/Containerfile"
            dest: "{{ user_home }}/.config/lima/Containerfile"
            mode: '0644'

        # ----------------------------------------------------------------------
        # TASK 6: Host Image Build via containers.podman
        # Build the host Podman container image using containers.podman.podman_image module.
        # ----------------------------------------------------------------------
        - name: "[Task 6] Build lightweight fedora-minimal Podman image on host"
          containers.podman.podman_image:
            name: "{{ image_tag }}"
            path: "{{ user_home }}/.config/lima"
            build:
              file: "{{ user_home }}/.config/lima/Containerfile"
              network: "host"
            state: build

        # ----------------------------------------------------------------------
        # TASK 7 & 8: Forced VM Container Re-creation Block
        # Stop and remove existing VM and container when recreate_vm is true.
        # ----------------------------------------------------------------------
        - name: "[Task 7 & 8] Stop and remove existing Lima VM and container if recreate_vm is true"
          block:
            - name: "[Task 7] Stop containerized Lima VM if running"
              ansible.builtin.command:
                cmd: "{{ podman_bin }} exec -u lima {{ container_name }} limactl delete -f {{ lima_vm_name }}"
              failed_when: false

            - name: "[Task 8] Remove existing Podman container"
              containers.podman.podman_container:
                name: "{{ container_name }}"
                state: absent
              failed_when: false
          when: (recreate_vm | default(false)) | bool

        # ----------------------------------------------------------------------
        # TASK 9: Inspect Host Podman Container Status
        # Check if the lima-vm-container is currently running on the host system.
        # ----------------------------------------------------------------------
        - name: "[Task 9] Check if Podman container exists and is running"
          ansible.builtin.command:
            cmd: "{{ podman_bin }} inspect -f '{{ '{{' }}.State.Running{{ '}}' }}' {{ container_name }}"
          register: container_running
          failed_when: false
          changed_when: false

        # ----------------------------------------------------------------------
        # TASK 10: Host Podman Container Launch via containers.podman
        # Run host container with KVM virtualization and USB bus passthrough using containers.podman_container.
        # ----------------------------------------------------------------------
        - name: "[Task 10] Launch Podman container with KVM and USB passthrough"
          containers.podman.podman_container:
            name: "{{ container_name }}"
            image: "{{ image_tag }}"
            state: started
            recreate: false
            security_opt:
              - "label=disable"
            devices:
              - "/dev/kvm"
            volumes:
              - "/dev/bus/usb:/dev/bus/usb"
              - "{{ user_home }}/.lima:{{ user_home }}/.lima:z"
              - "{{ user_home }}/.ssh:{{ user_home }}/.ssh:z"
              - "{{ user_home }}/.config/lima:{{ user_home }}/.config/lima:ro"
            cap_add:
              - "NET_ADMIN"
            net: "host"
          when: container_running.stdout != "true"

        # ----------------------------------------------------------------------
        # TASK 11: Lima Guest VM Configuration File Definition
        # Deploy Lima VM cloud-init and hardware configuration from assets template.
        # ----------------------------------------------------------------------
        - name: "[Task 11] Write Lima VM configuration file"
          ansible.builtin.template:
            src: "{{ playbook_dir }}/assets/github-runner.yaml.j2"
            dest: "{{ user_home }}/.config/lima/{{ lima_vm_name }}.yaml"
            mode: '0644'

        # ----------------------------------------------------------------------
        # TASK 12: Inspect Guest Lima VM Running Status
        # Query limactl list to determine if the github-runner VM is already active.
        # ----------------------------------------------------------------------
        - name: "[Task 12] Check if Lima VM is running inside Podman container"
          ansible.builtin.command:
            cmd: "{{ podman_bin }} exec -u lima {{ container_name }} limactl list {{ lima_vm_name }} --format '{{ '{{' }}.Status{{ '}}' }}'"
          register: lima_status
          failed_when: false
          changed_when: false

        # ----------------------------------------------------------------------
        # TASK 13: Start Lima KVM VM with SEGGER USB Passthrough
        # Boot the guest Ubuntu VM using QEMU with vendor ID 0x1366 USB passthrough.
        # ----------------------------------------------------------------------
        - name: "[Task 13] Start Lima VM inside Podman container with QEMU USB passthrough"
          ansible.builtin.command:
            cmd: >
              {{ podman_bin }} exec -u lima
              -e QEMU_SYSTEM_X86_64="qemu-system-x86_64 -device qemu-xhci,id=xhci -device usb-host,vendorid=0x1366"
              {{ container_name }} limactl start --name={{ lima_vm_name }} {{ user_home }}/.config/lima/{{ lima_vm_name }}.yaml
          when: "'Running' not in lima_status.stdout"

        # ----------------------------------------------------------------------
        # TASK 14: Ensure Serial Kernel Drivers & Rules in Guest VM
        # Reload cdc_acm kernel module and trigger udev rules inside the guest VM.
        # ----------------------------------------------------------------------
        - name: "[Task 14] Ensure cdc_acm driver and udev rules are active in VM"
          ansible.builtin.command:
            cmd: >
              {{ podman_bin }} exec -u lima {{ container_name }}
              limactl shell {{ lima_vm_name }} sudo bash -c
              "modprobe cdc_acm && udevadm control --reload-rules && udevadm trigger"
          changed_when: false

        # ----------------------------------------------------------------------
        # TASK 14a: Discover /dev/serial/by-id/ Symlinks in Guest VM
        # ----------------------------------------------------------------------
        - name: "[Task 14a] Query USB serial by-id symlink mappings inside Lima VM"
          ansible.builtin.command:
            cmd: >
              {{ podman_bin }} exec -u lima {{ container_name }}
              limactl shell {{ lima_vm_name }} bash -c
              'for f in /dev/serial/by-id/*; do [ -e "$f" ] && echo "$(readlink -f "$f")|$f"; done'
          register: serial_by_id_raw
          changed_when: false
          failed_when: false

        # ----------------------------------------------------------------------
        # TASK 14b: Map /dev/ttyACM* to Persistent /dev/serial/by-id/ Symlinks
        # ----------------------------------------------------------------------
        - name: "[Task 14b] Resolve /dev/ttyACM* paths to persistent /dev/serial/by-id/ symlinks"
          ansible.builtin.set_fact:
            tty_to_by_id_map: >-
              {% set mapping = {} %}
              {% if serial_by_id_raw.stdout_lines is defined %}
              {% for line in serial_by_id_raw.stdout_lines %}
              {% set parts = line.split('|') %}
              {% if parts | length == 2 %}
              {% set _ = mapping.update({parts[0]: parts[1]}) %}
              {% endif %}
              {% endfor %}
              {% endif %}
              {{ mapping }}

        - name: "[Task 14c] Update runner device definitions with resolved by-id paths"
          ansible.builtin.set_fact:
            github_runners: >-
              {% set updated_runners = [] %}
              {% for runner in github_runners %}
                {% set resolved_devices = [] %}
                {% for dev in (runner.devices | default([])) %}
                  {% set resolved = tty_to_by_id_map.get(dev, dev) %}
                  {% set _ = resolved_devices.append(resolved) %}
                {% endfor %}
                {% set _ = updated_runners.append(runner | combine({'devices': resolved_devices})) %}
              {% endfor %}
              {{ updated_runners }}

        # ----------------------------------------------------------------------
        # TASK 14d: Auto-Save Resolved Devices Back to vars/runners.yml
        # ----------------------------------------------------------------------
        - name: "[Task 14d] Persist resolved device symlinks back to vars/runners.yml"
          ansible.builtin.copy:
            dest: "{{ playbook_dir }}/vars/runners.yml"
            mode: '0644'
            content: |
              ---
              # Automatically updated with persistent /dev/serial/by-id/ symlinks
              {{ {'github_runners': github_runners} | to_nice_yaml(indent=2) }}
          when: not ansible_check_mode

        # ----------------------------------------------------------------------
        # TASK 15: Enable Podman Systemd Socket in Guest VM
        # Enable and start podman.socket in the Lima VM guest OS to support
        # container-in-container workflow steps (the 'container:' keyword).
        # ----------------------------------------------------------------------
        - name: "[Task 15] Ensure Podman socket service is enabled and active in Lima VM"
          ansible.builtin.command:
            cmd: >
              {{ podman_bin }} exec -u lima {{ container_name }}
              limactl shell {{ lima_vm_name }} sudo systemctl enable --now podman.socket
          changed_when: false

        # ----------------------------------------------------------------------
        # TASK 16: Export VM SSH Config for Cockpit Management
        # Generate SSH config snippet on the host so Cockpit can reach the guest VM.
        # ----------------------------------------------------------------------
        - name: "[Task 16] Export Lima SSH config to host for Cockpit access"
          ansible.builtin.shell:
            cmd: >
              {{ podman_bin }} exec -u lima {{ container_name }}
              limactl show-ssh --format config {{ lima_vm_name }}
              | sed 's|/home/lima/\.lima|{{ user_home }}/.lima|g'
              > {{ user_home }}/.ssh/config.d/lima-{{ lima_vm_name }}.conf
          changed_when: false

        # ----------------------------------------------------------------------
        # TASK 17: Set Permissions on Exported SSH Config
        # Ensure strict 0600 file permissions on generated SSH config snippet.
        # ----------------------------------------------------------------------
        - name: "[Task 17] Ensure correct file permissions on exported SSH config"
          ansible.builtin.file:
            path: "{{ user_home }}/.ssh/config.d/lima-{{ lima_vm_name }}.conf"
            mode: '0600'

        # ----------------------------------------------------------------------
        # TASK 18: Detect Device Drift on Existing Runner Containers
        # Inspect existing runner container device mappings inside the guest VM.
        # ----------------------------------------------------------------------
        - name: "[Task 18] Inspect device mappings of existing runner containers"
          ansible.builtin.command:
            cmd: >
              {{ podman_bin }} exec -u lima {{ container_name }}
              limactl shell {{ lima_vm_name }} sudo podman inspect
              --format '{% raw %}{{.Name}}: {{range .HostConfig.Devices}}{{.PathOnHost}} {{end}}{% endraw %}'
              {{ item.name }}
          loop: "{{ github_runners }}"
          register: runner_device_inspect
          failed_when: false
          changed_when: false
          tags: [runners]

        # ----------------------------------------------------------------------
        # TASK 19: Remove Drifted or Targeted Runner Containers via containers.podman
        # Force removal of runner containers if device drift occurs or recreation requested.
        # ----------------------------------------------------------------------
        - name: "[Task 19] Remove runner containers if devices drifted or targeted for recreation"
          ansible.builtin.command:
            cmd: >
              {{ podman_bin }} exec -u lima {{ container_name }}
              limactl shell {{ lima_vm_name }} sudo podman rm -f {{ item.item.name }}
          loop: "{{ runner_device_inspect.results }}"
          when:
            - item.rc == 0
            - >
              (recreate_runners | default(false) | bool) or
              (target_runner is defined and target_runner == item.item.name) or
              (
                item.item.devices is defined and
                (item.stdout | default('') != ('/' ~ item.item.name ~ ': ' ~ (item.item.devices | join(' ')) ~ ' ' ))
              )
          loop_control:
            label: "{{ item.item.name }}"
          tags: [runners]

        # ----------------------------------------------------------------------
        # TASK 20: Refresh Active Guest Runner Container List
        # Re-query podman ps inside the guest VM to verify active runner containers.
        # ----------------------------------------------------------------------
        - name: "[Task 20] Re-inspect active runner containers inside Lima VM"
          ansible.builtin.command:
            cmd: "{{ podman_bin }} exec -u lima {{ container_name }} limactl shell {{ lima_vm_name }} sudo podman ps -a --format '{{ '{{' }}.Names{{ '}}' }}'"
          register: existing_containers
          changed_when: false
          tags: [runners]

        # ----------------------------------------------------------------------
        # TASK 21: Acquire Registration Tokens via GitHub API
        # Post request to GitHub REST API for short-lived runner registration tokens.
        # ----------------------------------------------------------------------
        - name: "[Task 21] Fetch dynamic registration token for missing runners"
          ansible.builtin.uri:
            url: "https://api.github.com/repos/{{ item.owner }}/{{ item.repo }}/actions/runners/registration-token"
            method: POST
            headers:
              Authorization: "Bearer {{ github_pat }}"
              Accept: "application/vnd.github+json"
              X-GitHub-Api-Version: "2022-11-28"
            status_code: 201
          loop: "{{ github_runners }}"
          when:
            - github_pat is defined and github_pat | length > 0
            - item.name not in existing_containers.stdout_lines
          register: registration_tokens
          tags: [runners]

        # ----------------------------------------------------------------------
        # TASK 22: Launch & Register Runner Containers via containers.podman module syntax
        # Deploy unprivileged runner containers with dynamic CDC-ACM USB access (major 166)
        # and Podman socket passthrough (/var/run/docker.sock) for workflow 'container:' support.
        # ----------------------------------------------------------------------
        - name: "[Task 22] Launch and register new runner containers inside Lima VM"
          ansible.builtin.command:
            cmd: >
              {{ podman_bin }} exec -u lima {{ container_name }}
              limactl shell {{ lima_vm_name }} sudo podman run -d
              --name {{ item.item.name }}
              --restart=always
              --device-cgroup-rule='c 166:* rmw'
              -v /dev:/dev
              -v /run/podman/podman.sock:/var/run/docker.sock
              -v /var/cache/ccache:/gh-runner/.cache/ccache
              -e DOCKER_HOST=unix:///var/run/docker.sock
              -e CCACHE_DIR=/gh-runner/.cache/ccache
              --group-add dialout
              ghcr.io/actions/actions-runner:latest
              bash -c "./config.sh --url 'https://github.com/{{ item.item.owner }}/{{ item.item.repo }}' --token '{{ item.json.token if (item.json is defined and item.json.token is defined) else item.item.token }}' --name '{{ item.item.name }}' --labels '{{ item.item.labels }}' --unattended --replace --once && ./run.sh"
          loop: "{{ registration_tokens.results | default([]) }}"
          when:
            - item.skipped is not defined or not item.skipped
          loop_control:
            label: "{{ item.item.name }}"
          tags: [runners]

        # ----------------------------------------------------------------------
        # TASK 23: Fallback Runner Launcher for Static Tokens
        # Launch runner containers using static tokens supplied directly in runners.yml.
        # ----------------------------------------------------------------------
        - name: "[Task 23] Fallback launch runner containers if token provided directly in runners.yml"
          ansible.builtin.command:
            cmd: >
              {{ podman_bin }} exec -u lima {{ container_name }}
              limactl shell {{ lima_vm_name }} sudo podman run -d
              --name {{ item.name }}
              --restart=always
              --device-cgroup-rule='c 166:* rmw'
              -v /dev:/dev
              -v /run/podman/podman.sock:/var/run/docker.sock
              -v /var/cache/ccache:/gh-runner/.cache/ccache
              -e DOCKER_HOST=unix:///var/run/docker.sock
              -e CCACHE_DIR=/gh-runner/.cache/ccache
              {% if item.devices is defined and item.devices is iterable and item.devices | length > 0 %}{% for dev in item.devices %}--device {{ dev }} {% endfor %}{% endif %}
              --group-add dialout
              ghcr.io/actions/actions-runner:latest
              bash -c "./config.sh --url 'https://github.com/{{ item.owner }}/{{ item.repo }}' --token '{{ item.token }}' --name '{{ item.name }}' --labels '{{ item.labels }}' --unattended --replace --once && ./run.sh"
          loop: "{{ github_runners }}"
          when:
            - (github_pat is not defined or github_pat | length == 0)
            - item.name not in existing_containers.stdout_lines
            - item.token is defined
          loop_control:
            label: "{{ item.name }}"
          tags: [runners]

        # ----------------------------------------------------------------------
        # TASK 24: Define Host Systemd User Unit File
        # Copy systemd user service unit file for automated Lima VM engine startup from assets.
        # ----------------------------------------------------------------------
        - name: "[Task 24] Create systemd user service for containerized Lima VM engine"
          ansible.builtin.template:
            src: "{{ playbook_dir }}/assets/lima-vm-container.service.j2"
            dest: "{{ user_home }}/.config/systemd/user/lima-vm-container.service"
            mode: '0644'

        # ----------------------------------------------------------------------
        # TASK 24a: Define Self-Healing Script on Host
        # Copy self-healing check script from assets.
        # ----------------------------------------------------------------------
        - name: "[Task 24a] Create self-healing check script on host"
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/assets/self_healing_check.sh"
            dest: "{{ playbook_dir }}/self_healing_check.sh"
            mode: '0755'

        # ----------------------------------------------------------------------
        # TASK 24b: Define Self-Healing Watchdog Systemd Service Unit
        # Copy systemd user service for self-healing watchdog from assets.
        # ----------------------------------------------------------------------
        - name: "[Task 24b] Create systemd user service for self-healing watchdog"
          ansible.builtin.template:
            src: "{{ playbook_dir }}/assets/github-runner-self-healing.service.j2"
            dest: "{{ user_home }}/.config/systemd/user/github-runner-self-healing.service"
            mode: '0644'

        # ----------------------------------------------------------------------
        # TASK 24c: Define Self-Healing Watchdog Systemd Timer Unit (Every 15 mins)
        # Copy systemd user timer for self-healing watchdog from assets.
        # ----------------------------------------------------------------------
        - name: "[Task 24c] Create systemd user timer for self-healing watchdog"
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/assets/github-runner-self-healing.timer"
            dest: "{{ user_home }}/.config/systemd/user/github-runner-self-healing.timer"
            mode: '0644'

        # ----------------------------------------------------------------------
        # TASK 25: Enable & Start Host Systemd User Unit
        # Enable and activate lima-vm-container.service under user systemd instance.
        # ----------------------------------------------------------------------
        - name: "[Task 25] Enable and start systemd user service on host"
          ansible.builtin.systemd_service:
            name: lima-vm-container.service
            scope: user
            state: started
            enabled: true
            daemon_reload: true
          failed_when: false
          environment:
            XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid | default('1000') }}"

        # ----------------------------------------------------------------------
        # TASK 25a: Enable & Start Self-Healing Systemd Timer on Host
        # ----------------------------------------------------------------------
        - name: "[Task 25a] Enable and start self-healing systemd timer on host"
          ansible.builtin.systemd_service:
            name: github-runner-self-healing.timer
            scope: user
            state: started
            enabled: true
            daemon_reload: true
          failed_when: false
          environment:
            XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.user_uid | default('1000') }}"

      rescue:
        # ----------------------------------------------------------------------
        # TASK 26: Rescue Handler Failure Diagnostic Output
        # Print failure notice when a task inside the deployment block fails.
        # ----------------------------------------------------------------------
        - name: "[Task 26] Handle Failure - Print failure message"
          ansible.builtin.debug:
            msg: "A critical task failed during deployment. Proceeding with cleanup..."

        # ----------------------------------------------------------------------
        # TASK 27: Rescue Cleanup Stop Systemd Service
        # Stop host systemd user service during deployment failure cleanup.
        # ----------------------------------------------------------------------
        - name: "[Task 27] Cleanup - Stop systemd user service"
          ansible.builtin.systemd_service:
            name: lima-vm-container.service
            scope: user
            state: stopped
            enabled: false
            daemon_reload: true
          failed_when: false

        # ----------------------------------------------------------------------
        # TASK 28: Rescue Cleanup Remove Stale SSH Config
        # Remove generated SSH configuration snippet during cleanup.
        # ----------------------------------------------------------------------
        - name: "[Task 28] Cleanup - Remove stale Lima SSH config"
          ansible.builtin.file:
            path: "{{ user_home }}/.ssh/config.d/lima-{{ lima_vm_name }}.conf"
            state: absent

        # ----------------------------------------------------------------------
        # TASK 29: Trigger Explicit Ansible Playbook Failure
        # Raise playbook failure after rescue cleanup sequence completes.
        # ----------------------------------------------------------------------
        - name: "[Task 29] Trigger Ansible Failure"
          ansible.builtin.fail:
            msg: "Deployment failed. Cleanup completed successfully. Check playbook logs for details."
